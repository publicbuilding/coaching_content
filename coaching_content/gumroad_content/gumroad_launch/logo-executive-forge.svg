<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="#1B3A6B" stroke="#D4A574" stroke-width="4"/>
  
  <!-- Inner accent circle -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#D4A574" stroke-width="1" opacity="0.5"/>
  
  <!-- Ornate Hammer -->
  <g transform="translate(200, 140)">
    <!-- Hammer head - main body -->
    <rect x="-45" y="-50" width="90" height="45" fill="#D4A574" rx="5"/>
    
    <!-- Hammer head top border (darker) -->
    <rect x="-45" y="-50" width="90" height="5" fill="#A67C3F" rx="5"/>
    
    <!-- Hammer head shine stripe -->
    <rect x="-40" y="-43" width="80" height="6" fill="#F5E6C8" opacity="0.6" rx="3"/>
    
    <!-- Hammer head detail lines (horizontal) -->
    <line x1="-40" y1="-32" x2="40" y2="-32" stroke="#A67C3F" stroke-width="2.5"/>
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#A67C3F" stroke-width="2.5"/>
    <line x1="-35" y1="-8" x2="35" y2="-8" stroke="#A67C3F" stroke-width="2"/>
    
    <!-- Hammer handle - wood color -->
    <rect x="-13" y="-5" width="26" height="72" fill="#D4A574" rx="11"/>
    
    <!-- Handle highlight/shine -->
    <rect x="-9" y="-2" width="8" height="68" fill="#E8C77F" opacity="0.5" rx="8"/>
    
    <!-- Handle wood grain texture (vertical lines) -->
    <line x1="-8" y1="8" x2="-8" y2="55" stroke="#A67C3F" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="5" x2="0" y2="58" stroke="#A67C3F" stroke-width="1.5" opacity="0.3"/>
    <line x1="8" y1="8" x2="8" y2="55" stroke="#A67C3F" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Handle grip wraps (darker bands) -->
    <ellipse cx="0" cy="25" rx="13" ry="5" fill="#A67C3F" opacity="0.3"/>
    <ellipse cx="0" cy="40" rx="13" ry="5" fill="#A67C3F" opacity="0.3"/>
    <ellipse cx="0" cy="55" rx="13" ry="5" fill="#A67C3F" opacity="0.3"/>
    
    <!-- Handle end grip (knob) -->
    <circle cx="0" cy="70" r="9" fill="#A67C3F"/>
    <circle cx="0" cy="70" r="7" fill="#D4A574"/>
    <circle cx="-2" cy="68" r="2" fill="#F5E6C8" opacity="0.6"/>
  </g>
  
  <!-- Text inside circle -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#D4A574">EXECUTIVE</text>
  <text x="200" y="288" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#D4A574">FORGE</text>
  
  <!-- Tagline inside circle -->
  <text x="200" y="325" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#D4A574" opacity="0.95">Where Leaders Are Made</text>
</svg>