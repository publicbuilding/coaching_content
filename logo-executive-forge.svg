<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1B3A6B" stroke="#D4A574" stroke-width="3"/>
  
  <!-- Hammer icon (forge symbolism) -->
  <g transform="translate(100, 100)">
    <!-- Hammer head -->
    <rect x="-25" y="-35" width="50" height="30" fill="#D4A574" rx="3"/>
    <!-- Hammer handle -->
    <rect x="-8" y="-5" width="16" height="50" fill="#D4A574" rx="8"/>
    <!-- Handle accent -->
    <rect x="-6" y="15" width="12" height="20" fill="#FFF9F0" opacity="0.6" rx="6"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#D4A574">EXECUTIVE FORGE</text>
  
  <!-- Tagline arc (optional) -->
  <text x="100" y="188" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#D4A574" opacity="0.8">Where Leaders Are Made</text>
</svg>
